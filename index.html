<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO เมากาว | กิจกรรมสำหรับนักศึกษา</title>
<meta name="description" content="ดูกิจกรรม เข้าร่วม และสะสมชั่วโมงกิจกรรมได้ในที่เดียว">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#ffde59;--black:#000;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Kanit','Sarabun',system-ui,sans-serif;background:var(--yellow);color:var(--black)}
:focus-visible{outline:3px solid #1877f2;outline-offset:3px}

.page{min-height:100vh;display:grid;grid-template-rows:1fr auto;padding:clamp(24px,4vw,56px)}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.logo{width:clamp(110px,9vw,170px);aspect-ratio:1;border-radius:50%;object-fit:cover;display:block}
.brand{margin-top:20px;font-size:clamp(20px,1.6vw,28px);font-weight:600}

h1{margin-top:clamp(28px,6vh,72px);font-size:clamp(52px,9vw,150px);font-weight:700;line-height:.95;letter-spacing:-.03em}
.lead{margin-top:clamp(20px,3.5vh,40px);font-size:clamp(18px,1.6vw,28px);font-weight:300;line-height:1.55;max-width:34ch}

.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:clamp(32px,6vh,64px);width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:min(240px,100%);height:62px;padding:0 40px;border-radius:999px;font:400 clamp(17px,1.2vw,21px) 'Kanit',sans-serif;text-decoration:none;border:2px solid var(--black);transition:transform .15s,background .15s,color .15s}
.btn:hover{transform:translateY(-2px)}
.btn.fill{background:var(--black);color:var(--white)}
.btn.fill:hover{background:#222}
.btn.line{background:transparent;color:var(--black)}
.btn.line:hover{background:var(--black);color:var(--white)}

footer{display:flex;justify-content:center;font-size:15px;font-weight:300}
footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}
footer a:hover{font-weight:400}

@media (max-width:480px){.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <img class="logo" src="img/logo.jpg" alt="โลโก้ CEO เมากาว">
    <p class="brand">CEO เมากาว</p>
    <h1>กิจกรรม<br>ของเรา</h1>
    <p class="lead">ดูกิจกรรม เข้าร่วม และสะสมชั่วโมงกิจกรรมได้ในที่เดียว</p>
    <div class="cta">
      <a class="btn fill" href="login.html">เข้าสู่ระบบ</a>
      <a class="btn line" href="signup.html">สมัครสมาชิก</a>
    </div>
  </section>
  <footer><a href="admin-login.html">สำหรับผู้ดูแลระบบ</a></footer>
</main>

<script src="config.js"></script>
<script>
// ถ้าล็อกอินค้างอยู่แล้ว ข้ามไปหน้า Home ทันที
(async()=>{
  try{
    const r=await fetch('/api/me',{headers:{Accept:'application/json'}});
    if(r.ok&&(r.headers.get('content-type')||'').includes('json')){
      const me=await r.json();
      location.replace(me.role==='admin'?'admin.html':'home.html');
    }
  }catch(_){}
})();
</script>
</body>
</html>
